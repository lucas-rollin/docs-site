[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docs-site"
version = "0.1.1"
description = "Turn a folder of dumped HTML + PDF files into a browsable, searchable local documentation site."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Lucas Rollin Ferreira", email = "lucasrollinferreira@gmail.com" }
]
keywords = ["documentation", "pdf", "html", "search", "static-site", "reader"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Documentation",
    "Topic :: Text Processing :: Markup :: HTML",
]
dependencies = [
    "beautifulsoup4>=4.12",
    "jinja2>=3.1",
    "markdown>=3.6",
    "pypdf>=4.0",
]

[project.urls]
Homepage = "https://github.com/lucas-rollin/docs-site"
Repository = "https://github.com/lucas-rollin/docs-site"
Issues = "https://github.com/lucas-rollin/docs-site/issues"

[dependency-groups]
dev = [
    "djlint>=1.46.2",
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.16.9",
    "types-Markdown>=3.6",
]

[project.scripts]
docs-site = "docs_site.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
docs_site = ["py.typed", "templates/*", "static/css/*", "static/js/*"]

[tool.mypy]
mypy_path = "src"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["bs4.*", "markdown.*"]
ignore_missing_imports = true

[tool.djlint]
profile = "jinja"
extension = "html.jinja"
indent = 2
exclude = ".venv"
ignore = "H030,J004"