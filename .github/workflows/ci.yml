name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest

    env:
      UV_LINK_MODE: copy

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --group dev --python 3.14

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install node dependencies
        run: npm install

      - name: Run Biome check
        run: npx biome check

      - name: Run Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run djLint
        run: uv run djlint src/docs_site/templates --check --lint

      - name: Run type check
        run: uv run mypy src/docs_site

  test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
        - { os: ubuntu-latest,  python-version: "3.11" }
        - { os: ubuntu-latest,  python-version: "3.12" }
        - { os: ubuntu-latest,  python-version: "3.13" }
        - { os: ubuntu-latest,  python-version: "3.14" }
        - { os: macos-latest,   python-version: "3.11" }
        - { os: macos-latest,   python-version: "3.14" }
        - { os: windows-latest, python-version: "3.11" }
        - { os: windows-latest, python-version: "3.14" }

    env:
      UV_LINK_MODE: copy

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest