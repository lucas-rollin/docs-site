name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        run: uv run pytest

      - name: Check tag matches package version
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          PKG_VER="$(uv run python -c 'import importlib.metadata; print(importlib.metadata.version("docs-site"))')"
          echo "Release tag version: $TAG_VER, Package version: $PKG_VER"
          if [ "$TAG_VER" != "$PKG_VER" ]; then
            echo "Error: Release tag $TAG_VER does not match pyproject version $PKG_VER"
            exit 1
          fi

  release-build:
    needs: [verify-and-test]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build release distributions
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - release-build
    permissions:
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/project/docs-site/

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/